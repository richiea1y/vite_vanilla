<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JS-DAY-3</title>
</head>
<style>
  .container {
    display: flex;
    gap: 2rem;
    padding: 2rem;
    max-width: 1200px;
    margin: 0 auto;
  }

  .products-section {
    flex: 2;
  }

  .cart-section {
    flex: 1;
    background-color: #f5f5f5;
    padding: 1rem;
    border-radius: 8px;
    position: sticky;
    top: 2rem;
    max-height: calc(100vh - 4rem);
    overflow-y: auto;
  }

  .products-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 1rem;
  }

  .product-card {
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 1rem;
    text-align: center;
  }

  .product-image {
    width: 100%;
    height: auto;
    border-radius: 4px;
  }

  .cart-item {
    display: flex;
    gap: 1rem;
    margin-bottom: 1rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid #ddd;
  }

  .cart-item-image {
    width: 60px;
    height: 60px;
    border-radius: 4px;
  }

  .cart-item-details {
    flex: 1;
  }

  .cart-item-controls {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  button {
    background-color: #007bff;
    color: white;
    border: none;
    padding: 0.5rem 1rem;
    border-radius: 4px;
    cursor: pointer;
  }

  button:hover {
    background-color: #0056b3;
  }

  h2 {
    margin-bottom: 1rem;
  }

  #cart-total {
    margin-top: 1rem;
    font-weight: bold;
    text-align: right;
  }
</style>

<body>
  <div id="app">
    <div class="p-4">
      <h1 class="text-2xl my-4">原型鍊與類別(class)</h1>
    </div>
    <div id="shop"></div>
  </div>
</body>
<script type="module" src="/main.js"></script>
<script type="module" src="src/js/class-5.js"></script>

</html>
